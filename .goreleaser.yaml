version: 2

project_name: pins

before:
  hooks:
    - go mod tidy

builds:
  - id: pins
    main: .
    binary: pins
    # modernc.org/sqlite is pure Go. Linux and Windows need no C toolchain.
    # The macOS keyring backend (touchid-go, go-keychain) needs cgo, so darwin
    # builds enable it in the override below.
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    overrides:
      - goos: darwin
        goarch: amd64
        env:
          - CGO_ENABLED=1
      - goos: darwin
        goarch: arm64
        env:
          - CGO_ENABLED=1
    # Same tags as TAGS in the Makefile: leave out keyring backends pins does not use.
    tags:
      - keyring_no1password
      - keyring_nopass
      - keyring_nopassage
      - keyring_noprotonpass
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
